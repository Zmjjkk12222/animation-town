# ============================================================
# 开发环境配置（spring.profiles.active=dev）
# ============================================================
server.port=8081
# 绑定到所有网卡(0.0.0.0)，本地 localhost 和局域网其他设备均可访问，
# 不再依赖写死的 LAN IP（原 192.168.68.59 在 IP 变化/换网络时会启动失败，
# 表现为 Failed to start bean 'webServerStartStop'）。
# 若只想本机访问，可改成 127.0.0.1；若确需固定某网卡 IP，请填当前 ipconfig 查到的地址。
server.address=0.0.0.0

# ====================== 数据源（MySQL） ======================
# 请按你本地 MySQL 的账号密码修改下方 username / password
# 默认假设 root / root；若你的密码不同，改 spring.datasource.password 即可
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/animation_town?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ====================== MyBatis-Plus ======================
# XML 映射文件位置（当前仅用 BaseMapper，无 xml 也不报错）
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
# 实体类别名包
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# 控制台打印 SQL（调试用，上线可关）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键类型：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除配置
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

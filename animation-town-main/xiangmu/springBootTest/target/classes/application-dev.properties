# ============================================================
# 开发环境配置（spring.profiles.active=dev）
# ============================================================
server.port=8081

# ====================== 数据源（MySQL） ======================
# 请按你本地 MySQL 的账号密码修改下方 username / password
# 默认假设 root / root；若你的密码不同，改 spring.datasource.password 即可
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/animation_town?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456

# ====================== MyBatis-Plus ======================
# XML 映射文件位置（当前仅用 BaseMapper，无 xml 也不报错）
mybatis-plus.mapper-locations=classpath*:mapper/*.xml
# 实体类别名包
mybatis-plus.type-aliases-package=com.fenglin.springboottest.entity
# 控制台打印 SQL（调试用，上线可关）
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# 主键类型：数据库自增
mybatis-plus.global-config.db-config.id-type=auto
# 逻辑删除配置
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

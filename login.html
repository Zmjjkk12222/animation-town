<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动画小镇 · 小朋友登入</title>
<style>
  /* ============ 基础变量 ============ */
  :root {
    --sky-1: #aee7ff;
    --sky-2: #c9b8ff;
    --sky-3: #ffd6ec;
    --sun: #ffe27a;
    --ink: #4a3a6b;
    --pink: #ff8fc4;
    --pink-d: #ff5fa8;
    --mint: #7ee0c0;
    --blue: #6fb8ff;
    --yellow: #ffd23f;
    --card: #fffdf9;
    --shadow: rgba(106, 76, 160, 0.22);
    --font: "Comic Sans MS", "Baloo 2", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--font);
    color: var(--ink);
    background: linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    position: relative;
  }

  /* ============ 背景装饰 ============ */
  .bg-deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }

  .cloud {
    position: absolute;
    background: #fff;
    border-radius: 100px;
    opacity: 0.85;
    filter: drop-shadow(0 8px 12px rgba(120,120,180,.15));
  }
  .cloud::before, .cloud::after {
    content: ""; position: absolute; background: #fff; border-radius: 50%;
  }
  .cloud.c1 { width: 160px; height: 50px; top: 12%; left: -200px; animation: drift 26s linear infinite; }
  .cloud.c1::before { width: 70px; height: 70px; top: -30px; left: 25px; }
  .cloud.c1::after  { width: 50px; height: 50px; top: -18px; left: 90px; }
  .cloud.c2 { width: 120px; height: 40px; top: 30%; left: -200px; animation: drift 34s linear infinite 4s; transform: scale(.8); }
  .cloud.c2::before { width: 55px; height: 55px; top: -24px; left: 20px; }
  .cloud.c2::after  { width: 40px; height: 40px; top: -14px; left: 70px; }
  .cloud.c3 { width: 200px; height: 60px; top: 64%; left: -260px; animation: drift 40s linear infinite 8s; opacity:.7; }
  .cloud.c3::before { width: 85px; height: 85px; top: -38px; left: 35px; }
  .cloud.c3::after  { width: 60px; height: 60px; top: -22px; left: 110px; }

  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 320px)); } }

  .sun {
    position: absolute; top: 6%; right: 8%;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 40% 38%, #fff6c8, var(--sun));
    box-shadow: 0 0 0 14px rgba(255,226,122,.25), 0 0 50px rgba(255,210,80,.6);
    animation: pulse 5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }

  .star {
    position: absolute; font-size: 22px; color: #fff;
    text-shadow: 0 0 10px rgba(255,255,255,.8);
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity:.4; transform: scale(.8) rotate(0);} 50% { opacity:1; transform: scale(1.2) rotate(20deg);} }

  .balloon {
    position: absolute; bottom: -120px; width: 56px; height: 70px; border-radius: 50% 50% 50% 50%/55% 55% 45% 45%;
    animation: floatUp 14s ease-in infinite; opacity:.85;
  }
  .balloon::after { content:""; position:absolute; bottom:-22px; left:50%; width:1px; height:22px; background:rgba(80,60,120,.4);}
  .balloon.b1 { left: 12%; background: var(--pink); animation-delay: 0s; }
  .balloon.b2 { left: 78%; background: var(--blue); animation-delay: 5s; }
  .balloon.b3 { left: 60%; background: var(--mint); animation-delay: 9s; }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-30vh) rotate(4deg);} 100% { transform: translateY(-110vh) rotate(-4deg);} }

  /* ============ 登录卡片 ============ */
  .card {
    position: relative; z-index: 2;
    width: min(92vw, 420px);
    background: var(--card);
    border-radius: 34px;
    padding: 30px 28px 34px;
    box-shadow: 0 22px 50px var(--shadow), inset 0 0 0 6px #fff;
    border: 5px solid #fff;
    animation: pop .7s cubic-bezier(.18,1.4,.4,1) both;
    text-align: center;
  }
  @keyframes pop { 0% { transform: translateY(40px) scale(.92); opacity: 0;} 100% { transform: none; opacity: 1; } }

  /* 顶部锯齿花边 */
  .card::before {
    content:""; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width: 70%; height: 22px;
    background:
      radial-gradient(circle at 10px 0, var(--pink) 9px, transparent 10px) repeat-x;
    background-size: 20px 20px;
    opacity:.9;
  }

  .mascot { margin-top: 6px; animation: bob 3.2s ease-in-out infinite; }
  .mascot svg { width: 130px; height: 130px; }
  @keyframes bob { 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-10px) rotate(2deg);} }

  .title { margin: 8px 0 2px; font-size: 30px; letter-spacing: 1px; color: var(--pink-d); text-shadow: 2px 2px 0 #ffe0f0; }
  .subtitle { margin: 0 0 18px; font-size: 15px; color: #8a7aa8; }

  /* 模式切换 */
  .mode {
    display: flex; gap: 8px; background: #f1ecff; border-radius: 18px; padding: 6px;
    margin: 0 auto 20px; width: fit-content;
  }
  .mode button {
    border: none; background: transparent; font-family: var(--font); cursor: pointer;
    padding: 9px 18px; border-radius: 14px; font-size: 15px; color: #7a6aa0; transition: .25s;
  }
  .mode button.active { background: #fff; color: var(--pink-d); box-shadow: 0 4px 12px var(--shadow); transform: scale(1.04); }

  /* 表单字段 */
  .field { position: relative; margin-bottom: 16px; text-align: left; }
  .field label { display:block; font-size: 14px; margin: 0 0 6px 6px; color: #6a5a8a; }
  .field .box {
    display: flex; align-items: center; gap: 8px;
    background: #fbf7ff; border: 3px solid #ece3ff; border-radius: 18px;
    padding: 12px 14px; transition: .25s;
  }
  .field .box:focus-within { border-color: var(--pink); background: #fff; box-shadow: 0 0 0 4px rgba(255,143,196,.18); }
  .field .emoji { font-size: 20px; }
  .field input {
    border: none; outline: none; background: transparent; flex: 1;
    font-family: var(--font); font-size: 16px; color: var(--ink);
  }
  .field input::placeholder { color: #bcb0d6; }
  .toggle-pw {
    cursor: pointer; user-select: none; font-size: 18px; opacity: .7; border: none; background: none;
  }

  /* 记住 + 忘记 */
  .row { display:flex; align-items:center; justify-content: space-between; font-size: 13px; margin: 2px 4px 20px; }
  .remember { display:flex; align-items:center; gap:6px; cursor:pointer; color:#7a6aa0; }
  .remember input { width:16px; height:16px; accent-color: var(--pink); }
  .link { color: var(--blue); text-decoration: none; }
  .link:hover { text-decoration: underline; }

  /* 登录按钮 */
  .btn-login {
    width: 100%; border: none; cursor: pointer; font-family: var(--font);
    padding: 16px; border-radius: 20px; font-size: 20px; color: #fff;
    background: linear-gradient(120deg, var(--pink), var(--pink-d));
    box-shadow: 0 10px 22px rgba(255,95,168,.4);
    transition: transform .12s, box-shadow .2s; position: relative; overflow: hidden;
  }
  .btn-login:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(255,95,168,.5); }
  .btn-login:active { transform: scale(.96); }
  .btn-login::after {
    content:""; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent);
    transform: skewX(-20deg); animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine { 0%,60% { left:-60%; } 100% { left:130%; } }

  /* 第三方 */
  .divider { margin: 20px 0 14px; font-size: 13px; color: #b3a6cf; position: relative; }
  .divider span { background: var(--card); padding: 0 12px; position: relative; z-index: 1; }
  .divider::before { content:""; position:absolute; top:50%; left:0; right:0; height:1px; background:#ece3ff; }
  .socials { display:flex; justify-content:center; gap:14px; }
  .socials button {
    width: 54px; height: 54px; border-radius: 50%; border: 3px solid #fff; cursor: pointer;
    font-size: 24px; background: #fbf7ff; box-shadow: 0 6px 14px var(--shadow); transition: .2s;
  }
  .socials button:hover { transform: translateY(-4px) rotate(-6deg); }

  .signup { margin-top: 18px; font-size: 14px; color: #7a6aa0; }
  .signup a { color: var(--pink-d); font-weight: bold; text-decoration: none; }

  /* 提示气泡 */
  .toast {
    position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120%);
    background: #fff; color: var(--ink); padding: 12px 22px; border-radius: 16px;
    box-shadow: 0 10px 26px var(--shadow); font-size: 15px; z-index: 9; transition: .4s; border: 3px solid var(--mint);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* 彩纸 */
  .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 8; border-radius: 2px; }

  @media (max-width: 380px) {
    .title { font-size: 26px; }
    .mascot svg { width: 108px; height: 108px; }
  }
</style>
</head>
<body>

  <!-- 背景装饰 -->
  <div class="bg-deco">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="star" style="top:18%; left:14%; animation-delay:.2s">✦</div>
    <div class="star" style="top:42%; left:22%; animation-delay:1.1s">✧</div>
    <div class="star" style="top:24%; left:84%; animation-delay:.7s">✦</div>
    <div class="star" style="top:55%; left:88%; animation-delay:1.6s">✧</div>
    <div class="star" style="top:72%; left:18%; animation-delay:.4s">✦</div>
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
  </div>

  <!-- 登录卡片 -->
  <main class="card" id="card">
    <div class="mascot" id="mascot">
      <!-- 卡通吉祥物：会眨眼的星星小怪兽 -->
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs>
          <radialGradient id="body" cx="40%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#ffe27a"/>
            <stop offset="100%" stop-color="#ffb83f"/>
          </radialGradient>
        </defs>
        <!-- 身体 -->
        <path d="M60 8 L72 40 L104 40 L78 60 L90 94 L60 72 L30 94 L42 60 L16 40 L48 40 Z"
              fill="url(#body)" stroke="#ff9a2e" stroke-width="3" stroke-linejoin="round"/>
        <!-- 脸 -->
        <circle cx="48" cy="50" r="7" fill="#4a3a6b"/>
        <circle cx="72" cy="50" r="7" fill="#4a3a6b"/>
        <circle cx="50" cy="48" r="2.4" fill="#fff"/>
        <circle cx="74" cy="48" r="2.4" fill="#fff"/>
        <!-- 腮红 -->
        <circle cx="40" cy="62" r="6" fill="#ff9ec4" opacity=".8"/>
        <circle cx="80" cy="62" r="6" fill="#ff9ec4" opacity=".8"/>
        <!-- 嘴 -->
        <path id="mouth" d="M52 64 Q60 74 68 64" stroke="#4a3a6b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="title">动画小镇</h1>
    <p class="subtitle" id="sub">欢迎回来，小探险家！🎈</p>

    <!-- 模式切换 -->
    <div class="mode" role="tablist">
      <button id="m-kid" class="active" onclick="setMode('kid')">🧒 小朋友</button>
      <button id="m-parent" onclick="setMode('parent')">👨‍👩‍👧 爸爸妈妈</button>
    </div>

    <form id="form" onsubmit="return doLogin(event)">
      <div class="field">
        <label id="lbl-user">你的昵称 / 账号</label>
        <div class="box">
          <span class="emoji">🦄</span>
          <input id="user" type="text" placeholder="例如：爱画画的朵朵" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label>魔法密码</label>
        <div class="box">
          <span class="emoji">🔑</span>
          <input id="pwd" type="password" placeholder="输入你的秘密密码" autocomplete="current-password" />
          <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="显示密码">👁️</button>
        </div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" checked /> 记住我</label>
        <a class="link" href="#" onclick="toast('密码找回小精灵正在赶来～'); return false;">忘记密码？</a>
      </div>

      <button class="btn-login" type="submit">🚀 进入动画小镇</button>
    </form>

    <div class="divider"><span>或者用卡通朋友登入</span></div>
    <div class="socials">
      <button title="微信" onclick="toast('微信小恐龙带你飞～')">🐉</button>
      <button title="QQ" onclick="toast('QQ 企鹅来啦～')">🐧</button>
      <button title="Apple" onclick="toast('苹果精灵已就位～')">🍎</button>
    </div>

    <p class="signup">还没有账号？ <a href="#" onclick="toast('马上带你建一个奇妙角色！'); return false;">免费加入小镇 ✨</a></p>
  </main>

  <div class="toast" id="toast"></div>

<script>
  // 模式切换：小朋友 / 爸爸妈妈
  function setMode(mode){
    document.getElementById('m-kid').classList.toggle('active', mode==='kid');
    document.getElementById('m-parent').classList.toggle('active', mode==='parent');
    if(mode==='kid'){
      document.getElementById('lbl-user').textContent = '你的昵称 / 账号';
      document.getElementById('user').placeholder = '例如：爱画画的朵朵';
      document.getElementById('sub').textContent = '欢迎回来，小探险家！🎈';
    } else {
      document.getElementById('lbl-user').textContent = '家长手机号 / 账号';
      document.getElementById('user').placeholder = '请输入注册手机号';
      document.getElementById('sub').textContent = '家长您好，帮宝贝开启动画世界～👨‍👩‍👧';
    }
  }

  // 密码显隐
  function togglePw(){
    const p = document.getElementById('pwd');
    p.type = p.type === 'password' ? 'text' : 'password';
  }

  // 吉祥物表情：打字时变开心
  const user = document.getElementById('user');
  user.addEventListener('input', () => {
    const mouth = document.getElementById('mouth');
    if(user.value.length > 0){
      mouth.setAttribute('d','M48 62 Q60 80 72 62');
    } else {
      mouth.setAttribute('d','M52 64 Q60 74 68 64');
    }
  });

  // 提示气泡
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }

  // 登录：模拟成功 + 彩纸
  function doLogin(e){
    e.preventDefault();
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pwd').value;
    if(!u || !p){
      toast('要把昵称和密码都填好哦～ 🥺');
      // 吉祥物眨眼镜像抖动
      document.getElementById('mascot').animate(
        [{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],
        {duration:300}
      );
      return false;
    }
    toast('登入成功！正在打开动画小镇… 🎉');
    burstConfetti();
    return false;
  }

  // 彩纸动画
  function burstConfetti(){
    const colors = ['#ff8fc4','#6fb8ff','#7ee0c0','#ffd23f','#c9b8ff'];
    for(let i=0;i<60;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[i % colors.length];
      c.style.transform = `rotate(${Math.random()*360}deg)`;
      document.body.appendChild(c);
      const fall = 80 + Math.random()*40;
      const dur = 1800 + Math.random()*1400;
      c.animate(
        [
          {transform:`translateY(0) rotate(0)`, opacity:1},
          {transform:`translateY(${fall}vh) rotate(${Math.random()*720}deg)`, opacity:.9}
        ],
        {duration: dur, easing:'cubic-bezier(.3,.7,.4,1)'}
      ).onfinish = () => c.remove();
    }
  }
</script>
</body>
</html>

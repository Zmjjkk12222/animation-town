<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>动画小镇 · 加入我们</title>
<style>
  :root {
    --sky-1: #aee7ff; --sky-2: #c9b8ff; --sky-3: #ffd6ec;
    --sun: #ffe27a; --ink: #4a3a6b; --pink: #ff8fc4; --pink-d: #ff5fa8;
    --mint: #7ee0c0; --blue: #6fb8ff; --yellow: #ffd23f;
    --card: #fffdf9; --shadow: rgba(106, 76, 160, 0.22);
    --font: "Comic Sans MS", "Baloo 2", "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font); color: var(--ink);
    background: linear-gradient(160deg, var(--sky-1) 0%, var(--sky-2) 48%, var(--sky-3) 100%);
    overflow-x: hidden; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; position: relative; padding: 24px 0;
  }

  .bg-deco { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .cloud { position: absolute; background: #fff; border-radius: 100px; opacity: .85; filter: drop-shadow(0 8px 12px rgba(120,120,180,.15)); }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
  .cloud.c1 { width: 160px; height: 50px; top: 10%; left: -200px; animation: drift 26s linear infinite; }
  .cloud.c1::before { width: 70px; height: 70px; top: -30px; left: 25px; }
  .cloud.c1::after  { width: 50px; height: 50px; top: -18px; left: 90px; }
  .cloud.c2 { width: 120px; height: 40px; top: 34%; left: -200px; animation: drift 34s linear infinite 4s; transform: scale(.8); }
  .cloud.c2::before { width: 55px; height: 55px; top: -24px; left: 20px; }
  .cloud.c2::after  { width: 40px; height: 40px; top: -14px; left: 70px; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(calc(100vw + 320px)); } }
  .sun { position: absolute; top: 6%; right: 8%; width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 40% 38%, #fff6c8, var(--sun));
    box-shadow: 0 0 0 14px rgba(255,226,122,.25), 0 0 50px rgba(255,210,80,.6); animation: pulse 5s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { transform: scale(1);} 50% { transform: scale(1.06);} }
  .star { position: absolute; font-size: 22px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,.8); animation: twinkle 3s ease-in-out infinite; }
  @keyframes twinkle { 0%,100% { opacity:.4; transform: scale(.8) rotate(0);} 50% { opacity:1; transform: scale(1.2) rotate(20deg);} }
  .balloon { position: absolute; bottom: -120px; width: 56px; height: 70px; border-radius: 50% 50% 50% 50%/55% 55% 45% 45%; animation: floatUp 14s ease-in infinite; opacity:.85; }
  .balloon::after { content:""; position:absolute; bottom:-22px; left:50%; width:1px; height:22px; background:rgba(80,60,120,.4);}
  .balloon.b1 { left: 12%; background: var(--pink); }
  .balloon.b2 { left: 78%; background: var(--blue); animation-delay: 5s; }
  @keyframes floatUp { 0% { transform: translateY(0) rotate(-4deg);} 50% { transform: translateY(-30vh) rotate(4deg);} 100% { transform: translateY(-110vh) rotate(-4deg);} }

  .card {
    position: relative; z-index: 2; width: min(94vw, 440px);
    background: var(--card); border-radius: 34px; padding: 26px 26px 30px;
    box-shadow: 0 22px 50px var(--shadow), inset 0 0 0 6px #fff; border: 5px solid #fff;
    animation: pop .7s cubic-bezier(.18,1.4,.4,1) both; text-align: center;
  }
  @keyframes pop { 0% { transform: translateY(40px) scale(.92); opacity: 0;} 100% { transform: none; opacity: 1; } }
  .card::before { content:""; position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width: 70%; height: 22px; background: radial-gradient(circle at 10px 0, var(--mint) 9px, transparent 10px) repeat-x;
    background-size: 20px 20px; opacity:.9; }

  .mascot { margin-top: 4px; animation: bob 3.2s ease-in-out infinite; }
  .mascot svg { width: 116px; height: 116px; }
  @keyframes bob { 0%,100%{ transform: translateY(0) rotate(-2deg);} 50%{ transform: translateY(-10px) rotate(2deg);} }

  .title { margin: 6px 0 2px; font-size: 28px; letter-spacing: 1px; color: var(--pink-d); text-shadow: 2px 2px 0 #ffe0f0; }
  .subtitle { margin: 0 0 16px; font-size: 14px; color: #8a7aa8; }

  .mode { display: flex; gap: 8px; background: #eafaf3; border-radius: 18px; padding: 6px; margin: 0 auto 18px; width: fit-content; }
  .mode button { border: none; background: transparent; font-family: var(--font); cursor: pointer; padding: 9px 16px; border-radius: 14px; font-size: 14px; color: #5a8a78; transition: .25s; }
  .mode button.active { background: #fff; color: #2f9e7a; box-shadow: 0 4px 12px var(--shadow); transform: scale(1.04); }

  /* 头像选择 */
  .avatars { display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .avatars button { width: 50px; height: 50px; border-radius: 50%; border: 3px solid #e3f3ec; background: #f4fbf8; font-size: 24px; cursor: pointer; transition: .2s; }
  .avatars button:hover { transform: translateY(-3px); }
  .avatars button.active { border-color: var(--mint); background: #fff; box-shadow: 0 0 0 4px rgba(126,224,192,.25); transform: scale(1.08); }

  .field { position: relative; margin-bottom: 14px; text-align: left; }
  .field label { display:block; font-size: 13px; margin: 0 0 6px 6px; color: #6a5a8a; }
  .field .box { display: flex; align-items: center; gap: 8px; background: #fbf7ff; border: 3px solid #ece3ff; border-radius: 18px; padding: 11px 14px; transition: .25s; }
  .field .box:focus-within { border-color: var(--mint); background: #fff; box-shadow: 0 0 0 4px rgba(126,224,192,.18); }
  .field .emoji { font-size: 19px; }
  .field input { border: none; outline: none; background: transparent; flex: 1; font-family: var(--font); font-size: 15px; color: var(--ink); }
  .field input::placeholder { color: #bcb0d6; }
  .toggle-pw { cursor: pointer; user-select: none; font-size: 17px; opacity: .7; border: none; background: none; }

  /* 密码强度 */
  .strength { display: flex; gap: 5px; margin: 8px 6px 0; }
  .strength i { flex: 1; height: 7px; border-radius: 5px; background: #ece3ff; transition: .3s; }
  .strength i.on1 { background: #ff8f8f; } .strength i.on2 { background: #ffd23f; } .strength i.on3 { background: #7ee0c0; }

  .agree { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: #7a6aa0; text-align: left; margin: 4px 6px 18px; line-height: 1.5; }
  .agree input { width: 16px; height: 16px; accent-color: var(--mint); margin-top: 2px; flex-shrink: 0; }
  .agree a { color: var(--blue); text-decoration: none; }

  .btn-reg { width: 100%; border: none; cursor: pointer; font-family: var(--font); padding: 15px; border-radius: 20px; font-size: 19px; color: #fff;
    background: linear-gradient(120deg, var(--mint), #2fbf95); box-shadow: 0 10px 22px rgba(47,191,149,.4); transition: transform .12s, box-shadow .2s; position: relative; overflow: hidden; }
  .btn-reg:hover { transform: translateY(-2px); box-shadow: 0 14px 28px rgba(47,191,149,.5); }
  .btn-reg:active { transform: scale(.96); }
  .btn-reg::after { content:""; position:absolute; top:0; left:-60%; width:40%; height:100%; background: linear-gradient(120deg, transparent, rgba(255,255,255,.6), transparent); transform: skewX(-20deg); animation: shine 3.5s ease-in-out infinite; }
  @keyframes shine { 0%,60% { left:-60%; } 100% { left:130%; } }

  .login-link { margin-top: 16px; font-size: 14px; color: #7a6aa0; }
  .login-link a { color: var(--pink-d); font-weight: bold; text-decoration: none; }

  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120%); background: #fff; color: var(--ink); padding: 12px 22px; border-radius: 16px; box-shadow: 0 10px 26px var(--shadow); font-size: 15px; z-index: 9; transition: .4s; border: 3px solid var(--mint); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .confetti { position: fixed; top: -10px; width: 10px; height: 14px; z-index: 8; border-radius: 2px; }
</style>
</head>
<body>

  <div class="bg-deco">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="star" style="top:18%; left:14%; animation-delay:.2s">✦</div>
    <div class="star" style="top:42%; left:84%; animation-delay:1.1s">✧</div>
    <div class="star" style="top:70%; left:20%; animation-delay:.7s">✦</div>
    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
  </div>

  <main class="card">
    <div class="mascot">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <defs><radialGradient id="body2" cx="40%" cy="35%" r="70%">
          <stop offset="0%" stop-color="#b6f0d8"/><stop offset="100%" stop-color="#5fd6a8"/></radialGradient></defs>
        <path d="M60 8 L72 40 L104 40 L78 60 L90 94 L60 72 L30 94 L42 60 L16 40 L48 40 Z"
              fill="url(#body2)" stroke="#2fbf95" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="48" cy="50" r="7" fill="#4a3a6b"/><circle cx="72" cy="50" r="7" fill="#4a3a6b"/>
        <circle cx="50" cy="48" r="2.4" fill="#fff"/><circle cx="74" cy="48" r="2.4" fill="#fff"/>
        <circle cx="40" cy="62" r="6" fill="#ff9ec4" opacity=".8"/><circle cx="80" cy="62" r="6" fill="#ff9ec4" opacity=".8"/>
        <path d="M50 62 Q60 78 70 62" stroke="#4a3a6b" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>
    </div>

    <h1 class="title">加入动画小镇</h1>
    <p class="subtitle" id="sub">选一个可爱头像，创建你的角色吧！🌟</p>

    <div class="mode" role="tablist">
      <button id="m-kid" class="active" onclick="setMode('kid')">🧒 小朋友</button>
      <button id="m-parent" onclick="setMode('parent')">👨‍👩‍👧 爸爸妈妈</button>
    </div>

    <div class="avatars" id="avatars">
      <button type="button" class="active" onclick="pick(this)">🦄</button>
      <button type="button" onclick="pick(this)">🐱</button>
      <button type="button" onclick="pick(this)">🐰</button>
      <button type="button" onclick="pick(this)">🐻</button>
      <button type="button" onclick="pick(this)">🦊</button>
      <button type="button" onclick="pick(this)">🐸</button>
    </div>

    <form id="form" onsubmit="return doRegister(event)">
      <div class="field">
        <label id="lbl-user">你的昵称</label>
        <div class="box"><span class="emoji">✨</span><input id="user" type="text" placeholder="例如：爱画画的朵朵" autocomplete="username" /></div>
      </div>

      <div class="field" id="phone-field" style="display:none">
        <label>家长手机号</label>
        <div class="box"><span class="emoji">📱</span><input id="phone" type="tel" placeholder="用于账号安全与找回" /></div>
      </div>

      <div class="field">
        <label>设置魔法密码</label>
        <div class="box"><span class="emoji">🔑</span><input id="pwd" type="password" placeholder="至少 6 位，字母+数字更安全" oninput="checkStrength()" />
          <button type="button" class="toggle-pw" onclick="togglePw()">👁️</button></div>
        <div class="strength" id="strength"><i></i><i></i><i></i></div>
      </div>

      <div class="field">
        <label>再输一次密码</label>
        <div class="box"><span class="emoji">🔒</span><input id="pwd2" type="password" placeholder="和上面一样哦" /></div>
      </div>

      <label class="agree"><input type="checkbox" id="agree" />
        <span>我已阅读并同意 <a href="#" onclick="toast('打开《动画小镇安全公约》📜'); return false;">《安全公约》</a>，答应和爸爸妈妈一起保护账号安全。</span></label>

      <button class="btn-reg" type="submit">🎉 创建我的角色</button>
    </form>

    <p class="login-link">已经是小镇居民？ <a href="login.html">去登入 →</a></p>
  </main>

  <div class="toast" id="toast"></div>

<script>
  function setMode(mode){
    document.getElementById('m-kid').classList.toggle('active', mode==='kid');
    document.getElementById('m-parent').classList.toggle('active', mode==='parent');
    document.getElementById('phone-field').style.display = mode==='parent' ? 'block' : 'none';
    document.getElementById('lbl-user').textContent = mode==='kid' ? '你的昵称' : '家长昵称 / 账号';
    document.getElementById('sub').textContent = mode==='kid' ? '选一个可爱头像，创建你的角色吧！🌟' : '家长您好，先建账号再帮宝贝开通～👨‍👩‍👧';
  }
  function pick(el){
    document.querySelectorAll('#avatars button').forEach(b=>b.classList.remove('active'));
    el.classList.add('active');
  }
  function togglePw(){
    const p = document.getElementById('pwd');
    p.type = p.type === 'password' ? 'text' : 'password';
  }
  function checkStrength(){
    const v = document.getElementById('pwd').value;
    const bars = document.querySelectorAll('#strength i');
    let s = 0;
    if(v.length >= 6) s++;
    if(/[a-zA-Z]/.test(v) && /\d/.test(v)) s++;
    if(v.length >= 10) s++;
    bars.forEach((b,i)=> b.className = i < s ? (s===1?'on1':s===2?'on2':'on3') : '');
  }
  let toastTimer;
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
  }
  function doRegister(e){
    e.preventDefault();
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pwd').value;
    const p2 = document.getElementById('pwd2').value;
    if(!u){ toast('先给自己起个可爱的昵称吧～ 🥺'); return false; }
    if(p.length < 6){ toast('密码至少要 6 位哦～ 🔐'); return false; }
    if(p !== p2){ toast('两次密码不一样呢，再检查一下～ 🤔'); return false; }
    if(!document.getElementById('agree').checked){ toast('要勾选《安全公约》才能加入哦～ 📜'); return false; }
    toast('角色创建成功！欢迎来到动画小镇 🎉');
    burstConfetti();
    return false;
  }
  function burstConfetti(){
    const colors = ['#ff8fc4','#6fb8ff','#7ee0c0','#ffd23f','#c9b8ff'];
    for(let i=0;i<60;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[i % colors.length];
      document.body.appendChild(c);
      const fall = 80 + Math.random()*40, dur = 1800 + Math.random()*1400;
      c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${fall}vh) rotate(${Math.random()*720}deg)`,opacity:.9}],
        {duration: dur, easing:'cubic-bezier(.3,.7,.4,1)'}).onfinish = () => c.remove();
    }
  }
</script>
</body>
</html>
